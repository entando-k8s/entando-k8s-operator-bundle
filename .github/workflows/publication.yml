name: PUB

# Release verification - this workflow builds and pushes NOTHING.
#
# The bundle and index images are built and pushed from the release engineer's
# machine (./generate-manifests.sh then ./local-dev-publish.sh) because
# catalog.yaml has to record the index image digest BEFORE the tag is created,
# and because the index image is not reproducible: rebuilding it here would
# publish a different digest under the same tag than the one shipped to
# customers in catalog.yaml and entando-releases/manifest.
#
# So the tag is where the release is frozen and verified, not produced.

on:
  push:
    tags:
      - 'v*'

env:
  # Keep aligned with the helm version used to generate the committed manifests.
  HELM_VERSION: "v3.19.0"
  MAINLINE_VERSION: "7.5"

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Resolve the version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "> Verifying release $VERSION"

      - name: Regenerate the manifests at the tagged commit
        run: ./generate-manifests.sh --version "$VERSION" --mainline "$MAINLINE_VERSION"

      - name: Verify the tagged tree matches the generator output
        run: |
          # a diff in values.yaml means bundle.version does not match the tag;
          # a diff in manifests/ means the committed manifests are stale
          if ! git diff --exit-code -- manifests/ values.yaml requirements.yaml; then
            echo "::error::The tree tagged $GITHUB_REF_NAME is not what generate-manifests.sh produces. entando-releases clones this tag and would ship these files as-is."
            exit 1
          fi

      - name: Verify catalog.yaml
        run: |
          IMAGE="$(sed -nE 's/^[[:space:]]*image:[[:space:]]*(.*)$/\1/p' catalog.yaml | head -1)"
          echo "> catalog.yaml index image: $IMAGE"
          case "$IMAGE" in
            *@sha256:*) ;;
            *) echo "::error::catalog.yaml must pin the index image by digest, found: $IMAGE"; exit 1 ;;
          esac
          echo "CATALOG_IMAGE=$IMAGE" >> "$GITHUB_ENV"

          # the naming convention only applies to clean release tags
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            EXPECTED_NAME="entando-catalog-${VERSION//./-}"
            ACTUAL_NAME="$(sed -nE 's/^[[:space:]]*name:[[:space:]]*(.*)$/\1/p' catalog.yaml | head -1)"
            if [ "$ACTUAL_NAME" != "$EXPECTED_NAME" ]; then
              echo "::error::catalog.yaml CatalogSource is named \"$ACTUAL_NAME\", expected \"$EXPECTED_NAME\" for tag $GITHUB_REF_NAME"
              exit 1
            fi
          else
            echo "::notice::pre-release tag, skipping the catalog.yaml naming check"
          fi

      - name: Install crane
        uses: imjasonh/setup-crane@v0.1

      - name: Verify the pinned index image is pullable
        run: |
          crane manifest "$CATALOG_IMAGE" > /dev/null || {
            echo "::error::The index image pinned in catalog.yaml cannot be pulled: $CATALOG_IMAGE - was local-dev-publish.sh run before tagging?"
            exit 1
          }

      - name: Release summary
        run: |
          {
            echo "### Release $VERSION verified"
            echo ""
            echo "| check | result |"
            echo "|---|---|"
            echo "| tagged tree vs generate-manifests.sh | identical |"
            echo "| catalog.yaml | digest-pinned, name matches tag |"
            echo "| index image | pullable |"
            echo ""
            echo "Values for \`entando-releases/manifest\`:"
            echo ""
            echo '```sh'
            echo "OPERATOR_BUNDLE_VERSION=\"$GITHUB_REF_NAME\""
            echo "OKD_CATALOG_IMAGE=\"$CATALOG_IMAGE\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the catalog source
        uses: actions/upload-artifact@v4
        with:
          name: catalog-source-${{ env.VERSION }}
          path: catalog.yaml